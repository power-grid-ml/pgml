# Standard PEP 621 packaging metadata: `pgml` is a buildable / installable Python package
# (`pip install power-grid-ml`, wheels, type information). The pixi development workflow
# is configured separately in `pixi.toml`; this file intentionally has no `[tool.pixi]`
# table, so pixi continues to use `pixi.toml` and the dev env is unaffected.
#
# The distribution is named `power-grid-ml` (the import name `pgml` is taken on PyPI by an
# unrelated project); `import pgml` is unchanged.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "power-grid-ml"
description = "Differentiable, GPU-ready harmonic power flow for power grids (import name: pgml)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Markus de Koster" }]
keywords = [
    "harmonic power flow",
    "power quality",
    "differentiable simulation",
    "automatic differentiation",
    "distribution networks",
    "pytorch",
]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# Core runtime: the differentiable physics engine (schema + assembly + solver + geometry).
# Everything else — reference-library converters, scenario data I/O, plotting, the OpenDSS
# oracle — is an optional extra so a minimal install stays lean. Version ranges mirror the
# pinned pixi development environment.
dependencies = [
    "torch>=2.10,<3",
    "pydantic>=2.12,<3",
    "numpy>=2,<3",
    "scipy>=1.11",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
convert = ["pandapower>=3.5,<4", "power-grid-model>=1.13,<2"]
scenarios = ["polars>=1.39,<2", "pyarrow>=20"]
viz = ["matplotlib>=3.11,<4", "plotly>=5,<7", "networkx>=3.6,<4"]
opendss = ["opendssdirect-py>=0.9.4,<0.10"]
oracles = ["pandapower>=3.5,<4", "power-grid-model>=1.13,<2", "opendssdirect-py>=0.9.4,<0.10"]
docs = [
    "sphinx>=9.1,<10",
    "furo>=2025.1.0",
    "myst-parser>=4",
    "sphinx-autodoc-typehints>=2",
]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.16"]
all = ["power-grid-ml[convert,scenarios,viz,opendss,oracles]"]

[project.urls]
Homepage = "https://github.com/power-grid-ml/pgml"
Documentation = "https://power-grid-ml.readthedocs.io"
Repository = "https://github.com/power-grid-ml/pgml"
Issues = "https://github.com/power-grid-ml/pgml/issues"

[tool.hatch.version]
path = "src/pgml/__init__.py"

[tool.hatch.build.targets.wheel]
# Hatchling packages all VCS-tracked files under this root, so the shipped reference data
# (`pgml/data/*.yaml` — modeling defaults + the standards tables, read via
# importlib.resources) is included.
packages = ["src/pgml"]

[tool.hatch.build.targets.sdist]
include = ["src/pgml", "tests", "run", "docs", "README.md", "LICENSE", "CITATION.cff"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device (skipped on CPU-only hosts)",
    "opendss: runs a live OpenDSS solve via opendssdirect (slower, oracle tests)",
    "slow: long-running test",
]
