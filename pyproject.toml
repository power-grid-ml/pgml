[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power_grid_ml"
version = "0.0.1"
description = "Machine learning toolkit for tasks on power grids"
authors = [{ name = "Markus de Koster" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.5",
    "pyyaml",
    "keras>=3.5.0",
    "sqlalchemy",
    "psycopg2",
    "pandas"
]

[project.optional-dependencies]
tests = ["pytest >= 7.3.1"]

[project.urls]
Home = "https://github.com/cire-thk/power-grid-ml"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]



