experiment:
  name: "PowerGridStateEstimation_v1"
  description: "Experiment to test new state estimation algorithm on power grid data"

data:
  source: "database"
  grid_id: "Grid_1"
  split_ratio:
    train: 0.7
    validation: 0.15
    test: 0.15

preprocessing:
  scaling:
    type: "minmax"
    feature_range: [0, 1]
  feature_selection:
    type: "correlation"
    threshold: 0.8
    columns:
      - "voltage_magnitude"
      - "voltage_angle"
  complex_representation: # one of ["complex", "split"]
    type: "complex"
    # if split specify one or multiple of ['polar', 'cartesian', 'exponential'] otherwise has no effect
    representation: ["polar"]

model:
  type: "GNN"
  hyperparameters:
    hidden_units: [64, 32]
    dropout: 0.5
    learning_rate: 0.001
    epochs: 100
    batch_size: 32
  architecture:
    type: "GAN"
    num_layers: 2
    activation: "relu"
    output_activation: "linear"
    normalization: "batch"
    aggregation: "mean"
    use_bias: true

metrics:
  - "mae"
  - "rmse"

visualization:
  output_dir: "data/plots"

tracking:
  mlflow:
    enabled: true
    experiment_name: "PowerGridStateEstimation"
    tracking_uri: "http://localhost:5000"

random_seed: 42
