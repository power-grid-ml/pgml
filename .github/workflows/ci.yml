name: CI

# Enforce the project gates on every push and PR: lint/format, the full test suite
# (CPU — including the differentiability gradcheck gate and the OpenDSS/pandapower
# oracle comparisons), a strict docs build of this package's pages, and a packaging
# check (wheel + sdist build, clean install, import).
#
# The GPU device/dtype parity gate (`tests/gpu`) is NOT run here: GitHub-hosted runners
# have no CUDA, and pixi's default `gpu` environment requires it. Each job below installs
# only the CPU / docs environment explicitly. Run the GPU gate on a CUDA machine with
# `pixi run pytest -q tests/gpu` (or wire a self-hosted CUDA runner).
#
# pixi is pinned so the toolchain does not silently float to the latest release: pixi
# >= 0.71 rejects CUDA-less runners during `pixi list` for any environment under the
# `cuda` system-requirement (the `gpu` feature), which would fail the cpu/docs jobs even
# though those environments install fine. Bump deliberately alongside a local check.

# Every branch is built on push, not only main: a feature branch that is never opened as a
# PR otherwise runs no gate at all.
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.66.0
          environments: cpu
          cache: true
      # `run` is linted too: the example studies under it are production logic that the
      # tests import, not scratch files.
      - run: pixi run -e cpu ruff check src tests run
      - run: pixi run -e cpu ruff format --check src tests run

  test:
    name: Tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.66.0
          environments: cpu
          cache: true
      - run: pixi run -e cpu pytest -q

  docs:
    name: Docs (strict Sphinx build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.66.0
          environments: docs
          cache: true
      - run: pixi run -e docs docs-strict

  package:
    name: Package (build + clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      # A CPU torch keeps the clean-install check light; the wheel itself only requires
      # `torch` and lets the installer pick the build.
      - run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import pgml; print('pgml', pgml.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
