# pgml — modeling defaults (single source of truth for default VALUES & MODEL choices)
#
# Why this file exists
# --------------------
# Every modeling decision should be a DELIBERATE, documented choice — not a hidden
# implicit default buried in code (the opacity that makes OpenDSS discrepancies hard to
# explain). All default constants and default model selections live here, each with a
# short precise description and units.
#
# Resolution precedence (highest first) — see `pgml.defaults.resolve`:
#   1. explicit  — a value the user set on the component / grid (ALWAYS wins).
#   2. defaults  — the value in this file.
#   3. converter — inferred from a source library during conversion (e.g. an OpenDSS
#                  `LineGeometry`); the last-resort fallback when 1 and 2 do not apply.
#
# Schema of every leaf:  { value: <default>, units: <str>, description: <str> }.
# Ordered by component; extend with new components / parameters as the library grows.

# How a simulation distributes appliance power across phases. pgml is ALWAYS phase-
# domain, so this is operating-point RESOLUTION, not a change to the network solve.
calculation:
  symmetry:
    value: auto
    units: "enum{auto, symmetric, asymmetric}"
    description: >
      Whether a calculation is SYMMETRIC (each appliance's total P/Q split equally over
      its connected phases — balanced) or ASYMMETRIC (per-phase values honored, falling
      back to an equal split where a given appliance has none). `auto` (default) selects
      asymmetric iff ANY appliance or operating point carries per-phase data
      (*_per_phase_* or a per-phase operating point), else symmetric — so an asymmetric
      load distribution in the simulation config promotes the whole calculation to
      asymmetric even on a symmetrically-defined grid. Mirrors power-grid-model's
      symmetric=True/False (a symmetric calc averages an asymmetric load). See
      docs/pgml/modeling/asymmetric.md §1.

# Default terminal connection for appliances that do not set `connection` explicitly.
appliance:
  load:
    default_connection:
      value: wye
      units: "enum{wye, wye_grounded, delta}"
      description: >
        Connection for a MULTI-phase Load/Generator with no explicit `connection`. `wye`
        = each phase to neutral/ground; `delta` = phase-to-phase (line-to-line). LV
        distribution is predominantly wye; matches the OpenDSS `conn=wye` default. For
        wye, the return path is the node's Phase.N row if present, else ground. See
        docs/pgml/modeling/asymmetric.md §2, §4.
    single_phase_connection:
      value: wye
      units: "enum{wye, wye_grounded}"
      description: >
        Connection for a 1-phase Load/Generator with no explicit `connection`. `wye` =
        line-to-neutral (the European LV residential convention; the node's L-N voltage
        is the base). A line-to-line single-phase load is modeled as a 2-phase delta load
        instead. See docs/pgml/modeling/asymmetric.md §3.

  # How a voltage-regulating Generator (a `voltage_regulation` block = a PV terminal)
  # has its reactive limits enforced by the nonlinear power flow. See
  # docs/pgml/modeling/der-pv-storage.md §4.5.
  generator:
    enforce_q_limits:
      value: true
      units: "bool"
      description: >
        Whether a regulating generator's `q_min_var`/`q_max_var` bound its reactive
        output. true (default) enforces them by PV-to-PQ switching: a unit whose
        required reactive power leaves the band is re-solved as a plain PQ injection
        pinned at the violated limit, and returns to regulation when the terminal
        voltage crosses its setpoint from the other side. false solves every
        regulating generator unbounded, which is pandapower `runpp`'s own default
        (`enforce_q_lims=False`). Overridable per call:
        `solve_power_flow(enforce_q_limits=...)`.
    q_limit_switch_rounds_max:
      value: 12
      units: "count"
      description: >
        Maximum number of PV-to-PQ switching rounds (each round is one full Newton
        solve at a fixed active set). The loop normally settles in one to three
        rounds; hitting the cap logs a WARNING naming the oscillating generators and
        keeps the last solution.
    q_limit_hysteresis_pu:
      value: 1.0e-6
      units: "pu"
      description: >
        Voltage band, in per unit of the terminal's nominal, a pinned generator must
        cross before it is released back to voltage regulation. Guards the switching
        loop against cycling on solver noise; far below any physical regulation
        deadband.
    q_limit_hysteresis_rel:
      value: 1.0e-9
      units: "pu"
      description: >
        Reactive band, relative to the widest of the generator's reactive limits, the
        required reactive power must exceed before the unit is pinned at that limit.
        Guards against switching on the converged solve's rounding noise.

line:

  # Which frequency-dependent line model is written to `Line.harmonic_line_model` for
  # an R/X line that has NO `conductor_geometry` and NO explicit model. Resolved by the
  # converters (`pgml.convert.*.to_grid`, which log the default they applied) and by
  # `pgml.geometry.apply_default_harmonic_model(grid)` for hand-built grids. Assembly
  # itself never resolves a default: a line whose `harmonic_line_model` is still None is
  # assembled from its stored parameters as given (R const unless the line carries a
  # `resistance_frequency` law, X∝h).
  harmonic_model:
    three_phase:
      value: sequence_aware
      units: "enum{sequence_aware, positive_sequence, naive, none}"
      description: >
        Default model for a 3-phase R/X line. `sequence_aware` decomposes Z_abc into
        Z1 (earth-free, X∝h + skin) and Z0 (carries the Carson earth-return resistance),
        then recombines — the model a 4-wire UNBALANCED LV harmonic study needs. Earth
        return is excited only by zero-sequence / residual current, so it correctly
        vanishes for balanced operation. `positive_sequence` = Z1 only (no Z0 damping);
        `naive` = R const, X∝h; `none` = leave the line unresolved (no model written).
    single_phase:
      value: positive_sequence
      units: "enum{sequence_aware, positive_sequence, naive, none}"
      description: >
        Default model for a 1- or 2-phase R/X line: skin-corrected R, X∝h, no earth
        floor. A genuine single-wire-earth-return (SWER) line should instead carry an
        explicit `conductor_geometry` so the full Carson earth return applies.
    skin_effect:
      value: true
      units: "bool"
      description: >
        Apply the Bessel I0/I1 skin-effect resistance rise (m(f0)=1) in the positive- and
        sequence-aware models. false → R constant (the naive X∝h, R-const model).
        Per-line override: `Line.harmonic_skin_effect`.

  # Assumed zero-sequence/positive-sequence ratios used ONLY when expanding a
  # positive-sequence (r1/x1/c1) line into a 3-phase phase-domain matrix for an
  # asymmetric calculation, and the source grid carries no explicit zero-sequence
  # data (typical for balanced pandapower / power-grid-model datasets). The phase
  # matrix follows the symmetric-component identity: Z_self=(Z0+2*Z1)/3,
  # Z_mutual=(Z0-Z1)/3 (and likewise for the shunt C). An explicit per-line value or
  # native zero-sequence data always wins over these defaults.
  zero_sequence:
    r0_over_r1:
      value: 4.0
      units: "ratio"
      description: >
        Assumed series RESISTANCE ratio R0/R1 for sequence->phase line expansion when no
        explicit R0 is available. ~4 is a common overhead-line rule of thumb (the earth
        return dominates the zero-sequence resistance).
    x0_over_x1:
      value: 3.0
      units: "ratio"
      description: >
        Assumed series REACTANCE ratio X0/X1 for sequence->phase line expansion when no
        explicit X0 is available (~3 typical for overhead lines).
    c0_over_c1:
      value: 0.5
      units: "ratio"
      description: >
        Assumed shunt CAPACITANCE ratio C0/C1 for sequence->phase line expansion when no
        explicit C0 is available (~0.5 typical: less zero-sequence than positive-sequence
        capacitance).
    r0_includes_earth_return:
      value: false
      units: "bool"
      description: >
        Whether a line's R0 already contains the Carson earth-return resistance at f0.
        true (real zero-sequence measurements / datasheet values): the harmonic model
        splits R0 into a conductor part R0 − 3·Re(f0) that carries the skin-effect
        multiplier and an earth part 3·Re(f) that does not. false (the default, correct
        for an R0 synthesised from `r0_over_r1`): R0 is treated as conductor resistance
        and the earth return enters only as the increment 3·(Re(f) − Re(f0)). Both forms
        reproduce the stored R0 exactly at f0; they differ only in how much of R0 the
        skin multiplier scales. Per-line override:
        `Line.earth_return.r0_includes_earth_return`.

  # Carson/Deri earth-return path (zero-sequence and geometry lines).
  earth_return:
    resistivity_ohm_m:
      value: 100.0
      units: "ohm*m"
      description: >
        Soil resistivity ρ for the Carson/Deri earth-return path (Z0 and geometry lines).
        100 Ω·m is the OpenDSS / IEEE standard default (average soil).
    resistance_coeff_ohm_per_m_per_hz:
      value: 9.869604401089357e-07   # = math.pi**2 * 1e-7 = omega*mu0/8 per Hz
      units: "ohm/(m*Hz)"
      description: >
        Carson earth-return resistance per unit length per Hz: Re(f) = coeff·f. The
        physical Carson value is π²·1e-7 Ω/m/Hz (= ω·μ0/8 divided by f). Geometry-
        independent; the dominant frequency-dependent DAMPING of zero-sequence harmonics.
        Mirrors OpenDSS's user-settable per-LineCode Rg (whose default 0.01805 is this
        same physical value at 60 Hz in Ω per 1000 ft, so on a metric line OpenDSS's
        default is ≈3.28× smaller). Per-line override:
        `Line.earth_return.resistance_coeff_ohm_per_m_per_hz`; 0 removes the earth path.
    reactance_coeff_ohm_per_m_per_hz:
      value: 1.2566370614359173e-06   # = mu0 = 4*pi*1e-7
      units: "ohm/(m*Hz) per ln-unit"
      description: >
        Carson/Deri earth-return reactance per unit length per Hz per ln-unit:
        Xg(f) = coeff·f·ln(658.5·sqrt(ρ/f)). The physical value is μ0. Only its
        frequency DERIVATIVE enters the lumped zero-sequence model, where the
        ρ-dependent log cancels: X0(h) = h·X0(f0) − 1.5·coeff·f0·h·ln(h). Mirrors
        OpenDSS's per-LineCode Xg (its default 0.155081 is this value at 60 Hz, ρ=100,
        in Ω per 1000 ft). Used only by `x0_frequency: carson_sublinear`. Per-line
        override: `Line.earth_return.reactance_coeff_ohm_per_m_per_hz`.
    x0_frequency:
      value: linear
      units: "enum{linear, carson_sublinear}"
      description: >
        Frequency law of the zero-sequence REACTANCE in the lumped sequence_aware model.
        `linear` (default): X0(h) = X0·h — pure geometric scaling; the earth-return
        reactance sub-linearity is left to the conductor-geometry path, which resolves
        the real return path (deep earth vs a nearby neutral/sheath).
        `carson_sublinear`: additionally subtract the Carson/Deri earth-return reactance
        decay 1.5·coeff·f0·h·ln(h) (geometry- and ρ-independent), which reproduces
        OpenDSS's Xg frequency correction for an R/X line. Exact at f0 either way.
        Per-line override: `Line.earth_return.x0_frequency`.
    x0_exponent:
      value: 1.0
      units: "exponent"
      description: >
        Exponent p in X0(h) = X0·h^p for the lumped sequence_aware model. 1.0 (default)
        is the geometric scaling. p < 1 is an EMPIRICAL way to bend the zero-sequence
        reactance sub-linear (e.g. to match a measured Z0(h)); prefer
        `x0_frequency: carson_sublinear` for the physically derived form. Per-line
        override: `Line.earth_return.x0_exponent`.

  # Conductor-geometry (Carson/Deri) path: how the conductor's INTERNAL inductance
  # enters the self impedance. A published GMR is a POWER-FREQUENCY quantity: it folds
  # the internal inductance of the conductor (mu0/8pi for a solid round conductor, i.e.
  # GMR = e^(-1/4)*radius) into one equivalent radius. Skin effect pushes the current to
  # the surface, so the internal inductance decays with frequency and a fixed GMR
  # over-states the reactance at harmonic frequencies.
  geometry:
    internal_inductance:
      value: gmr
      units: "enum{gmr, gmr_skin, gmr_power_frequency, bessel}"
      description: >
        Which internal-inductance model the conductor-geometry path uses.
        `gmr`: the published GMR carries the internal inductance at every frequency and
        the internal reactance is dropped (frozen at its power-frequency value).
        `gmr_skin`: the published GMR's internal reactance is scaled by the solid-round
        Bessel decay Im(Zint(f))/(f*mu0/4), so the power-frequency value is reproduced
        exactly and the internal inductance decays with skin effect (continuous in f).
        `gmr_power_frequency`: `gmr` inside `power_frequency_band_hz` and `bessel`
        outside it, which is OpenDSS's rule (LineConstants/CNLineConstants/
        TSLineConstants). Reproduces OpenDSS at every frequency; discontinuous at the
        band edges unless GMR = e^(-1/4)*radius.
        `bessel`: physical radius for the spacing term plus the full frequency-dependent
        Bessel internal impedance at every frequency, i.e. the first-principles solid
        round conductor; it discards the published GMR and so ignores stranding.
        `gmr`, `gmr_skin` and `bessel` are continuous in frequency; all four agree at
        power frequency for a solid round conductor. Needs a conductor radius for every
        option except `gmr`.
    power_frequency_band_hz:
      value: [40.0, 1000.0]
      units: "Hz"
      description: >
        Exclusive frequency band (low, high) in which `internal_inductance:
        gmr_power_frequency` keeps the published GMR. OpenDSS hard-codes
        `(f < 1000.0) and (f > 40.0)` in LineConstants.pas, so (40, 1000) reproduces it;
        only change this to study the sensitivity of the threshold.

  # R/X → conductor-geometry synthesis (when a feeder ships only R/X, no coordinates).
  conductor:
    gmr_over_radius:
      value: 0.7788                  # = e^{-1/4}, solid round conductor
      units: "ratio"
      description: >
        Geometric-mean-radius / physical-radius for a solid round conductor (e^{-1/4}).
        Used to pick a PHYSICAL GMR when synthesizing a two-conductor go/return
        equivalent from positive-sequence R1/X1 (so the GMR never exceeds the radius).
    radius_m:
      value: 0.0102
      units: "m"
      description: >
        Default conductor outer radius (~ACSR) for R/X→geometry synthesis when no
        conductor data is supplied. Affects only the (tiny) synthesized capacitance.
    phase_spacing_m:
      value: 1.0
      units: "m"
      description: >
        Initial phase-conductor spacing for the equilateral 3-phase R/X→geometry
        synthesis (the Newton fit then adjusts the spacing + GMR to reproduce X1 and
        X0). ~1 m is a typical LV/MV phase separation; the value only seeds the solve
        and trades off against the fitted GMR, so the reproduced Z1/X0 are independent
        of it (within the physical range).
    height_overhead_m:
      value: 10.0
      units: "m"
      description: Default conductor height above ground for an overhead ('ol') line.
    height_cable_m:
      value: 1.0
      units: "m"
      description: >
        Default (virtual) height for a cable ('cs') line; the Deri earth model needs y>0.

# Branch modeling limits that are not physical parameters of one element.
branch:
  near_ideal_series_resistance_ohm:
    value: 1.0e-4
    units: "ohm"
    description: >
      Series resistance that stands in for an IDEAL (zero-impedance) branch — a bus
      coupler, a jumper, or a closed switch with no impedance data. The nodal
      formulation inverts every branch's series impedance to get its primitive
      admittance, so an exactly zero impedance has no stamp; the solvers refuse it by
      name (`pgml.solver.check_branch_impedances`) and point at this value. 1e-4 Ohm is
      small enough to be electrically negligible on a distribution feeder and large
      enough to keep the admittance matrix conditioned; the pandapower converter
      substitutes it for a bus-bus switch that carries no `z_ohm`.

# Two-winding transformer vector group + grounding.
transformer:
  # Vector group assumed when a Transformer carries no explicit from_/to_connection
  # (e.g. a positive-sequence dataset with no winding metadata). The phase-domain stamp
  # builds the winding-incidence primitive Y = N^T Y_winding N from these connections;
  # the delta winding blocks the zero sequence (traps triplen/residual harmonics) and
  # supplies the nominal sqrt(3) ratio + clock phase shift. An explicit per-transformer
  # connection always wins over these defaults (precedence: explicit > config).
  vector_group:
    from:
      value: delta
      units: "enum{wye, wye_grounded, delta}"
      description: >
        HV-side winding connection assumed when none is given. `delta` (the D of Dyn) is
        the standard distribution-transformer HV winding: it blocks zero-sequence /
        triplen harmonics from propagating to the MV network.
    to:
      value: wye_grounded
      units: "enum{wye, wye_grounded, delta}"
      description: >
        LV-side winding connection assumed when none is given. `wye_grounded` (the yn of
        Dyn) is the standard LV winding: the solidly grounded neutral provides the
        zero-sequence return path on the LV side.
    clock:
      value: 11
      units: "integer 0..11 (IEC clock; HV->LV shift = +30*clock degrees, mod 360, positive = LV lags HV)"
      description: >
        IEC clock number assumed when no explicit tap.shift_deg is given. `11` (Dyn11,
        LV leads HV by 30 deg) is the IEC / European distribution-transformer default.
        For a transformer with explicit connections the clock is read from tap.shift_deg
        (rounded to the nearest 30 deg) instead.

  # How the WINDING RESISTANCE of a transformer behaves with frequency. The leakage
  # reactance always scales with the order (X(h) = 2*pi*h*f0*L); this selects what R does.
  # OpenDSS calls the choice `XRConst` per transformer; pandapower and power-grid-model
  # have no frequency-dependent winding resistance at all (their R is always constant).
  # `element` (the default) follows each Transformer's OWN `harmonic_xr_constant` field
  # (which the OpenDSS converter fills from `XRConst`), so the per-element value wins as
  # everywhere else; the two other values force one law on every transformer, for a study
  # that wants the bound either way.
  harmonic_resistance:
    law:
      value: element
      units: "enum{element, constant, xr_constant}"
      description: >
        `element` = per-transformer `harmonic_xr_constant` (False = R constant, True = R
        scales with the order so X/R stays constant); `constant` = force R constant on
        every transformer (OpenDSS's `XRConst=No`, the conservative default of every
        reference tool: transformer damping at high orders is then UNDERSTATED because no
        eddy-current/stray-loss rise is modelled); `xr_constant` = force R proportional to
        the order on every transformer (OpenDSS's `XRConst=Yes`). A
        `Transformer.resistance_frequency` multiplier curve (skin effect / a measured
        frequency correction) multiplies on top of whichever law applies.

  # WHERE the magnetizing (core) shunt y_m = G_m + jB_m is attached. The schema stores it
  # referred to the HV/from side; the three reference engines attach it in three different
  # places, which is a genuinely different topology (not a referral difference): the
  # magnetizing current either does or does not see the leakage drop of a winding.
  #   - OpenDSS attaches the whole branch to the LAST winding's terminal (winding 2, i.e.
  #     the to/LV side for a standard import), on that winding's base. Verified on a live
  #     `Yprim`: the magnetizing contribution appears ONLY in the winding-2 diagonal.
  #   - power-grid-model splits it half onto its `Y_tt` (to side) and half (through the
  #     tap) onto `Y_ff` (from side).
  #   - pandapower keeps it on the LV base inside its pi shunt.
  # `from_terminal` (the default) is the conservative choice for a study driven from the HV
  # side: core loss is then independent of loading. Pick `to_terminal` to reproduce an
  # OpenDSS circuit exactly, or `split` to reproduce power-grid-model.
  magnetizing_placement:
    value: from_terminal
    units: "enum{from_terminal, to_terminal, split}"
    description: >
      Terminal the magnetizing shunt is stamped on: `from_terminal` = the HV/from phase
      diagonal (default), `to_terminal` = the LV/to diagonal with the branch referred
      through the squared rated-voltage ratio (OpenDSS's own placement), `split` = half on
      each terminal, each referred to its own side (power-grid-model's placement). The
      VALUE is always `magnetizing_conductance_s`/`magnetizing_inductance_h` as stored,
      i.e. referred to the from side. Typical residual between the choices: ~2e-4 pu of the
      transformer admittance at a realistic 0.5 % magnetizing current.

  # Zero-sequence leakage VALUE of a two-winding transformer whose `zero_sequence`
  # override is not set. The zero-sequence PATH always comes from the winding
  # connections + clock (a delta or zigzag winding blocks it); these ratios set only the
  # VALUE carried on that path, through the same symmetric-component identity the line
  # and source paths use: Z_self=(Z0+2*Z1)/3, Z_mutual=(Z0-Z1)/3 on the winding leakage
  # admittance. An explicit `Transformer.zero_sequence` always wins. Converting a source
  # that DOES supply zero-sequence data (pandapower `vk0_percent`/`vkr0_percent`) reads
  # it instead; a grounded-wye pairing that falls back to these ratios logs a WARNING.
  zero_sequence:
    r0_over_r1:
      value: 1.0
      units: "ratio"
      description: >
        Assumed R0/R1 of the leakage impedance when a transformer carries no explicit
        `zero_sequence` override. 1.0 (Z0 = Z1) is what OpenDSS's and power-grid-model's
        two-winding transformer models imply -- neither has a zero-sequence leakage
        input, so their zero sequence sees the positive-sequence winding impedance
        through the winding topology.
    x0_over_x1:
      value: 1.0
      units: "ratio"
      description: >
        Assumed X0/X1 of the leakage impedance when a transformer carries no explicit
        `zero_sequence` override (1.0 = Z0 = Z1). A THREE-LIMB core YNyn unit has
        X0/X1 ~ 0.3-1.0 (the zero-sequence flux closes through tank and air, not the
        core); a five-limb or shell-type unit is close to 1.0. A zigzag grounding
        transformer has X0/X1 well below 1 by design.

# Upstream-grid (slack Source) modeling.
source:
  # Assumed zero-sequence/positive-sequence ratios of the Source's Thevenin impedance,
  # used ONLY when a source is expanded to a genuine 3-phase (abc) Thevenin and the
  # dataset carries no native zero-sequence data (pandapower `ext_grid.x0x_max` /
  # `r0x0_max`, power-grid-model `source.z01_ratio`, OpenDSS `Vsource.R0`/`X0`). The
  # per-phase matrix follows the same symmetric-component identity the line path uses:
  # Z_self=(Z0+2*Z1)/3, Z_mutual=(Z0-Z1)/3. Native data always wins; falling back to
  # these ratios logs a WARNING naming the source. The zero-sequence source impedance
  # only matters where zero-sequence current can actually reach the source (a 4-wire
  # feeder fed directly by the source, or a grounded-wye HV winding between them); a
  # delta HV winding blocks it.
  zero_sequence:
    r0_over_r1:
      value: 1.0
      units: "ratio"
      description: >
        Assumed R0/R1 of the source Thevenin when the dataset has no zero-sequence data.
        1.0 (Z0 = Z1) is the value power-grid-model (`z01_ratio`) and pandapower
        (`x0x_max`) themselves default to, i.e. the assumption of a solidly grounded
        upstream network. A network whose zero-sequence path runs through an additional
        transformer or an impedance-earthed neutral has R0/R1 > 1 -- set the native field
        (or raise this ratio) for a study where triplen/residual current reaches the
        source.
    x0_over_x1:
      value: 1.0
      units: "ratio"
      description: >
        Assumed X0/X1 of the source Thevenin when the dataset has no zero-sequence data
        (1.0 = Z0 = Z1, matching power-grid-model's and pandapower's own defaults). X0/X1
        of a real feeding network ranges from ~1 (solidly grounded, close ground source)
        to >10 (remote or impedance-earthed ground source).

  # Finite series (short-circuit) impedance for a Source whose converter gave a
  # near-ideal value (e.g. the stock pandapower CIGRE LV ext-grid -> R~1e-6 Ohm, which
  # short-circuits the bus at harmonics). Builders like cigre_lv_full_grid apply this so
  # harmonics are not fully absorbed at the source. Specified at the SOURCE node's rated
  # voltage; the transformer ratio^2 divides it down on the LV side, so cross-feeder LV
  # coupling stays modest unless this is made (unrealistically) large. Increase to
  # exaggerate cross-feeder spread; user/grid value always wins.
  series_impedance_ohm:
    value: 5.0
    units: "ohm"
    description: >
      |Z| of the upstream-grid Thevenin/Norton series impedance at the source's rated
      voltage, used when the converted source is near-ideal. Larger = weaker grid = more
      harmonic voltage at the source bus and more cross-feeder coupling.
  xr_ratio:
    value: 10.0
    units: "ratio X/R"
    description: >
      X/R ratio of the source series impedance (R = |Z|/sqrt(1+xr^2), X = xr*R). ~10 is
      typical for a stiff MV grid. NOT the same convention as the short-circuit-input
      converter's `rx_ratio` (`SourceShortCircuitInput.rx_ratio`, consumed by
      `pgml.convert._common.thevenin_from_sk`): that one is R/X (the reciprocal of this
      one), matching power-grid-model's own `rx_ratio` field. Converting a value between
      the two means inverting it, not copying it.

# Nonlinear-solve convergence and working precision. The engine solves in SI units, so
# every convergence measure is normalised before it is compared with a tolerance: the
# power mismatch by `s_base_va`, the voltage update by each node's line-to-neutral rated
# voltage. That makes one tolerance mean the same thing on a 400 V LV node and on a
# 20 kV node, and makes an iteration count comparable with pandapower / power-grid-model.
solver:
  convergence:
    mismatch_pu:
      value: 1.0e-8
      units: "per unit of s_base_va (apparent-power mismatch)"
      description: >
        PRIMARY convergence criterion of the nonlinear power flow: the largest nodal
        apparent-power mismatch |V_i * conj(F_i)| / s_base_va over the free (non-slack)
        rows, where F = Y*V + I_device(V) - I_slack. 1e-8 pu is pandapower's default
        (`tolerance_mva` on a 1 MVA base) and the same order as power-grid-model's
        `error_tolerance`, so iteration counts are comparable across the three tools.
        The achievable value is bounded below by the cancellation error of Y*V, which the
        solver estimates per row from the working precision and reports; a tolerance
        below that floor logs a warning and the floor governs.
    update_pu:
      value: 1.0e-8
      units: "per unit of each node's line-to-neutral rated voltage"
      description: >
        SECONDARY convergence criterion: the largest per-row voltage update
        |V_new - V_old| / V_LN(node) of the current-injection fixed point (or of the
        Newton step). Both criteria must hold. Per-row normalisation makes the measure
        independent of the voltage level and of the number of rows, so a multi-voltage
        grid or an ensemble of grids solved in one system is judged exactly like a single
        feeder. power-grid-model uses the same quantity (max voltage deviation in pu).
    s_base_va:
      value: 1.0e+6
      units: "VA"
      description: >
        Apparent-power base of the per-unit power mismatch. 1 MVA matches pandapower's
        default `sn_mva`, so the mismatch tolerance carries the same meaning there.
        A grid-specific base (e.g. the transformer rating) only rescales the criterion.
  precision:
    complex64_cond_warn:
      value: 1.0e+3
      units: "condition number of the factored system"
      description: >
        Estimated 1-norm condition number above which a plain complex64 solve logs a
        one-time WARNING. The relative error of a single-precision solve grows like
        cond * eps_single (eps_single ~ 1.2e-7), so at cond = 1e3 about four of the seven
        single-precision digits are already gone. SI-unit power systems sit above this
        routinely — measured on the factored fundamental system: IEEE-33 cond ~2.8e3,
        CIGRE LV ~1.7e4 single-phase-equivalent and ~5.5e4 three-phase, and a stiff
        source or a near-ideal switch pushes it decades higher — which is the point of
        the warning. The recommended recipe: solve at complex128, or at complex128 with
        precision="mixed" (single-precision factorization refined against
        double-precision residuals), and store complex64. The estimate itself costs a
        few back-substitutions and is taken ONCE per process.
    refine_steps:
      value: 2
      units: "count"
      description: >
        Iterative-refinement steps applied by a mixed-precision solve: the solution of
        the single-precision factorization is corrected with residuals formed at the
        working precision, x <- x + A_single^-1 (b - A*x). Each step multiplies the
        relative error by about cond * eps_single, so two steps recover double-precision
        accuracy for cond up to ~1e5 and are the documented default; the nonlinear
        outer iteration (itself a residual correction) continues the refinement beyond
        that.
