# IEC 61000-3-2 harmonic CURRENT emission limits for equipment drawing <= 16 A per
# phase. These are appliance current-emission limits (what a device is permitted to
# INJECT into the supply), NOT voltage-compatibility levels (cf. en50160.yaml). They
# provide the physically correct per-order reference for a device current fingerprint.
#
# Source: IEC 61000-3-2 (Electromagnetic compatibility (EMC) - Part 3-2: Limits -
# Limits for harmonic current emissions), Tables 1-3 (Class A absolute, Class C
# percentage, Class D relative). Values are stable across editions 3.0-5.1; the
# amendments refined Class-C low-power lighting conditions and test procedures, not the
# base tables reproduced here.
#
# Four equipment classes:
#   Class A - balanced three-phase equipment and everything not in B/C/D. Absolute
#             per-phase rms current limits [A] (Table 1). Odd 3..39 explicit for
#             3..13, then 0.15*15/n; even 2..10 explicit for 2..6, then 0.23*8/n.
#   Class B - portable tools / arc-welding equipment: Class A limits x 1.5.
#   Class C - lighting equipment. Percentage of the fundamental input current
#             (Table 2); the 3rd-harmonic limit is 30 * lambda % where lambda is the
#             circuit power factor.
#   Class D - equipment of 75..600 W with a special (capacitor-input) wave shape
#             (PCs, monitors, TVs). Relative limit [mA/W] of the active input power
#             (Table 3); odd orders only, 3..11 explicit then 3.85/n.
#
# Formula-derived orders are pre-evaluated here to keep the table a plain data lookup.

class_a:
  unit: A # absolute per-phase rms amperes
  limits:
    2: 1.08
    3: 2.30
    4: 0.43
    5: 1.14
    6: 0.30
    7: 0.77
    8: 0.23
    9: 0.40
    10: 0.184
    11: 0.33
    13: 0.21
    15: 0.15
    17: 0.1324
    19: 0.1184
    21: 0.1071
    23: 0.0978
    25: 0.09
    27: 0.0833
    29: 0.0776
    31: 0.0726
    33: 0.0682
    35: 0.0643
    37: 0.0608
    39: 0.0577

class_b:
  unit: A # Class A limits scaled by the Class B factor
  multiplier_of_class_a: 1.5

class_c:
  unit: percent # percent of the fundamental input current
  power_factor_scaled_orders: [3] # h3 limit is 30 * lambda %
  limits:
    2: 2.0
    3: 30.0
    5: 10.0
    7: 7.0
    9: 5.0
    11: 3.0
    13: 3.0
    15: 3.0
    17: 3.0
    19: 3.0
    21: 3.0
    23: 3.0
    25: 3.0
    27: 3.0
    29: 3.0
    31: 3.0
    33: 3.0
    35: 3.0
    37: 3.0
    39: 3.0

class_d:
  unit: mA_per_W # milliamps per watt of active input power
  limits:
    3: 3.4
    5: 1.9
    7: 1.0
    9: 0.5
    11: 0.35
    13: 0.2962
    15: 0.2567
    17: 0.2265
    19: 0.2026
    21: 0.1833
    23: 0.1674
    25: 0.154
    27: 0.1426
    29: 0.1328
    31: 0.1242
    33: 0.1167
    35: 0.11
    37: 0.1041
    39: 0.0987
