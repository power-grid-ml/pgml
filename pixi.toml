[workspace]
name = "pgml"
version = "0.1.0"
description = "ML pipeline for power grids"
channels = ["https://prefix.dev/conda-forge"]
platforms =["linux-64", "win-64"]

[activation.env]
PYTHONPATH = "src"

[tool.pixi.activation.env]
PYTHONPATH = "src"

[feature.gpu.system-requirements]
cuda = "12.4"

[feature.gpu.dependencies]
cuda-version = ">=12.9,<13"
pytorch-gpu = ">=2.10.0,<3"

[feature.cpu.dependencies]
pytorch-cpu = ">=2.10.0,<3"


[dependencies]
python = ">=3.13.12,<3.15"
polars = ">=1.39.3,<2"
pyarrow = ">=20.0.0,<24"
mlflow = ">=3.10.1,<4"
lightning = ">=2.6.1,<3"
duckdb = ">=1.5.1,<2"
pydantic = ">=2.12.5,<3"
pydantic-settings = ">=2.13.1,<3"
pixi-pycharm = ">=0.0.11,<0.0.12"
torch-geometric = "*"
pandapower = ">=2.14.7,<3"
power-grid-model = ">=1.13.94,<2"
ruff = ">=0.15.17,<0.16"
pytest = ">=9.0.3,<10"
sympy = ">=1.14.0,<2"
matplotlib = ">=3.11.0,<4"
networkx = ">=3.6.1,<4"
plotly = ">=5,<7"
pyyaml = ">=6,<7"

[feature.docs.dependencies]
sphinx = ">=9.1.0,<10"
furo = ">=2025.1.0"
myst-parser = ">=4.0.0"
sphinx-autodoc-typehints = ">=2.0.0"

[feature.docs.tasks]
docs = "sphinx-build -b html docs docs/_build/html"
docs-clean = "sphinx-build -b html -E docs docs/_build/html"
docs-linkcheck = "sphinx-build -b linkcheck docs docs/_build/linkcheck"
docs-strict = "sphinx-build -b html -W --keep-going docs docs/_build/html"

[environments]
cpu = ["cpu"]
default = ["gpu"]
docs = ["docs"]

[pypi-dependencies]
opendssdirect-py = { version = ">=0.9.4, <0.10", extras = ["extras"] }
