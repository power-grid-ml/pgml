[workspace]
name = "pgml"
version = "0.5.1"
description = "Differentiable, GPU-ready harmonic power flow for power grids"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "win-64"]

# The package is imported from the source tree (no install step): `import pgml` resolves
# to `src/pgml` whenever a command runs from the repository root.
[activation.env]
PYTHONPATH = "src"

[feature.gpu.system-requirements]
cuda = "12.4"

[feature.gpu.dependencies]
cuda-version = ">=12.9,<13"
pytorch-gpu = ">=2.10.0,<3"

[feature.cpu.dependencies]
pytorch-cpu = ">=2.10.0,<3"

[dependencies]
# Pinned to Python 3.13 across the suite (torch-geometric, the pgl GNN layer, is not yet
# compatible with Python 3.14); 3.13 also aligns the dev box with the conda clusters.
python = ">=3.13.12,<3.14"
pydantic = ">=2.12.5,<3"
pyyaml = ">=6,<7"
polars = ">=1.39.3,<2"
pyarrow = ">=20.0.0,<24"
pixi-pycharm = ">=0.0.11,<0.0.12"
power-grid-model = ">=1.13.94,<2"
ruff = ">=0.15.17,<0.16"
pytest = ">=9.0.3,<10"
matplotlib = ">=3.11.0,<4"
networkx = ">=3.6.1,<4"
plotly = ">=5,<7"
# pandapower (PyPI) pins these tightly (~=); keep the conda solve inside its ranges
# so the pypi resolution on top does not conflict with conda-pinned versions.
typing_extensions = ">=4.16,<5"
tqdm = ">=4.68,<5"
pandas = ">=2.3,<3"
scipy = ">=1.18,<2"
numpy = ">=2.2,<2.5"
packaging = ">=26.0,<27"
numba = ">=0.65.1,<0.66"

[feature.docs.dependencies]
sphinx = ">=9.1.0,<10"
furo = ">=2025.1.0"
myst-parser = ">=4.0.0"
sphinx-autodoc-typehints = ">=2.0.0"

[feature.docs.tasks]
docs = "sphinx-build -b html docs docs/_build/html"
docs-clean = "sphinx-build -b html -E docs docs/_build/html"
docs-linkcheck = "sphinx-build -b linkcheck docs docs/_build/linkcheck"
docs-strict = "sphinx-build -b html -W --keep-going docs docs/_build/html"

[environments]
cpu = ["cpu"]
default = ["gpu"]
# The docs build imports the package (autodoc), so it needs a torch: the CPU build.
docs = ["docs", "cpu"]

[pypi-dependencies]
opendssdirect-py = { version = ">=0.9.4, <0.10", extras = ["extras"] }
# pandapower comes from PyPI: the conda-forge package (3.2.1) pins scipy<1.14,
# which has no python-3.13 builds; the PyPI distribution tracks current
# scipy/numpy/pandas.
pandapower = ">=3.5.4, <4"
